[package]
name = "ring-cloud"
version = "0.1.0"
edition = "2024"
description = "A blocking client for Ring's cloud API: sign in (with two-factor), list cameras, read their events, snapshots and recordings"
license = "MIT OR Apache-2.0"

[dependencies]
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json", "native-certs"] }
