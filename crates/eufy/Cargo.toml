[package]
name = "eufy"
version = "0.1.0"
edition = "2024"
description = "A client for the eufy security cloud (the \"mega\" algo_ecdh API): sign in, list devices, read a lock's state, lock and unlock it over eufy's P2P protocol"
license = "MIT OR Apache-2.0"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
p256 = { version = "0.13", features = ["ecdh"] }
rsa = { version = "0.9", features = ["hazmat"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json", "native-certs"] }
