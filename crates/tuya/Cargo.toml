[package]
name = "tuya"
version = "0.1.0"
edition = "2024"
description = "Tuya (Smart Life) devices over the local protocol: switch, brightness, state"
license = "MIT OR Apache-2.0"

[dependencies]
# The protocol framing and crypto (3.1-3.5).
rustuya-tokio = "0.4.6"
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "macros"] }

[dev-dependencies]
# The device side of the protocol, for a light simulated in the tests.
rustuya-core = "0.4.6"
