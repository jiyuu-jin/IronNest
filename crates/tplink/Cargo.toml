[package]
name = "tplink"
version = "0.1.0"
edition = "2021"
description = "Pure Rust TP-Link smart device client library"
license = "MIT OR Apache-2.0"

[features]
# The async client, discovery and device operations (tokio). Off, the crate
# is the protocol alone — the frame and the setup-mode exchange — which also
# builds for targets with no tokio networking (a browser).
default = ["client"]
client = ["dep:tokio", "dep:csscolorparser", "dep:log"]

[dependencies]
tokio = { version = "1", features = ["net", "time", "io-util", "macros", "rt-multi-thread", "sync"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csscolorparser = { version = "0.7.0", optional = true }
log = { version = "0.4", optional = true }
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"
